<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,regular,500,600,700,800" rel="stylesheet" />
    <title>REST Countries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/styling/country.css">
    <script src="/src/country.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="title">Where in the the world?</h1>
        <p><i class="fa-regular fa-moon"></i> Dark Mode</p>
    </header>
    <main>
        <a href="/text/index.html" class="back-button"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <div class="country-details">
            <img src="https://flagcdn.com/af.svg" alt="flag">
            <div class="details-container">
                <h1></h1>
                <div class="details-text">
                    <p><b>Native Name: </b><span class="native-name"></span></p>
                    <p><b>Population: </b><span class="population"></span></p>
                    <p><b>Region: </b><span class="region"></span></p>
                    <p><b>Sub Region: </b><span class="sub-region"></span></p>
                    <p><b>Capital: </b><span class="capital"></span></p>
                    <p><b>Top Level Domain: </b><span class="domain"></span></p>
                    <p><b>Currencies: </b><span class="currencies"></span></p>
                    <p><b>Languages: </b><span class="languages"></span></p>
                </div>
                <div class="border-countries">
                    <p><b>Border Countries: </b></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
