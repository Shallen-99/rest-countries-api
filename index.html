<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,regular,500,600,700,800" rel="stylesheet" />
    <title>REST Countries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styling/style.css">
    <script src="./src/script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="title">Where in the the world is Carmen Sandiego?</h1>
        <p class="dark-mode"><i class="fa-regular fa-moon"></i> Dark Mode</p>
    </header>
    <main>
        <div class="searching">

            <div>
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search" placeholder=" Search For A Country....">
            </div>

            <select name="filter" id="filter">
                <option hidden>Filter By Region</option>
                <option value="Africa">Africa</option>
                <option value="America">America</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="Oceania">Oceania</option>
            </select>

        </div>

        <div class="container">
            
        </div>
    </main>  
</body>
</html>
